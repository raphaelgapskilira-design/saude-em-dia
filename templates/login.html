
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Saúde em Dia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 { color: #16845b; text-align: center; }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16845b;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        a { color: #16845b; }

        .mensagem { color: #c0392b; }
    </style>
</head>

<body>
    <div class="container">
        <h1>Saúde em Dia</h1>
        <h2>Entrar na conta</h2>

        <p class="mensagem">{{ mensagem }}</p>

        <form method="POST">
            <label>E-mail</label>
            <input type="email" name="email" required>

            <label>Senha</label>
            <input type="password" name="senha" required>

            <button type="submit">Entrar</button>
        </form>

        <p>Não tem conta? <a href="/cadastro">Criar conta</a></p>
        <a href="/">Voltar ao início</a>
    </div>
</body>
</html>
