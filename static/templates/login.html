
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Saúde em Dia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5f2;
            margin: 0;
            text-align: center;
        }

        header {
            background: #087f5b;
            color: white;
            padding: 25px;
        }

        main {
            background: white;
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            background: #087f5b;
            color: white;
            padding: 13px 30px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        a {
            color: #087f5b;
        }

        .mensagem {
            color: #c0392b;
        }
    </style>
</head>

<body>

<header>
    <h1>Saúde em Dia</h1>
    <p>Acesse sua conta</p>
</header>

<main>
    <h2>Entrar</h2>

    <form method="POST">
        <input
            type="email"
            name="email"
            placeholder="Seu e-mail"
            required
        >

        <input
            type="password"
            name="senha"
            placeholder="Sua senha"
            required
        >

        <br><br>

        <button type="submit">Entrar</button>
    </form>

    <p class="mensagem">{{ mensagem }}</p>

    <p>Não tem conta?</p>
    <a href="/cadastro">Criar conta</a>

    <br><br>
    <a href="/">Voltar ao início</a>
</main>

</body>
</html>
