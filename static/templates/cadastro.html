
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Saúde em Dia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            color: #16845b;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16845b;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #106b49;
        }

        a {
            color: #16845b;
            text-decoration: none;
        }

        .mensagem {
            color: #c0392b;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Saúde em Dia</h1>
        <h2>Criar conta</h2>

        <p class="mensagem">{{ mensagem }}</p>

        <form method="POST">

            <label>Nome completo</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required>

            <label>E-mail</label>
            <input type="email" name="email" placeholder="Digite seu e-mail" required>

            <label>Senha</label>
            <input type="password" name="senha" placeholder="Crie uma senha" required>

            <button type="submit">Cadastrar</button>

        </form>

        <p>Já possui uma conta? <a href="/login">Entrar</a></p>

        <a href="/">Voltar ao início</a>

    </div>

</body>
</html>
